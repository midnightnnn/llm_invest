timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE: asia-northeast3-docker.pkg.dev/rising-parser-464807-f6/llm-arena/llm-arena-ui:latest
  _SERVICE_NAME: llm-arena-ui
  _REGION: asia-northeast3
  _RUN_SERVICE_ACCOUNT: rising-parser-464807-f6@appspot.gserviceaccount.com
  _MIN_INSTANCES: "1"
  _MEMORY: 1Gi

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform
      - linux/amd64
      - -t
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_IMAGE}
      - --region
      - ${_REGION}
      - --project
      - ${PROJECT_ID}
      - --service-account
      - ${_RUN_SERVICE_ACCOUNT}
      - --allow-unauthenticated
      - --port
      - "8080"
      - --min-instances
      - ${_MIN_INSTANCES}
      - --memory
      - ${_MEMORY}
      - --cpu
      - "1"
      - --concurrency
      - "80"
      - --timeout
      - "60"
      - --quiet

images:
  - ${_IMAGE}
